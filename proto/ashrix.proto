syntax = "proto3";

package proto;

option go_package = "github.com/JohnnyAsh-U/ashrix-api/proto/ashrix.proto;proto";

import "google/protobuf/timestamp.proto";

// =============================================================================
// ENUMS
// =============================================================================

enum NodeType {
  NODE_TYPE_UNSPECIFIED = 0;
  NODE_TYPE_GATEWAY     = 1;
  NODE_TYPE_CONNECTOR   = 2;
}

// Maps directly to the lifecycle state machine in the architecture doc.
enum NodeState {
  NODE_STATE_UNSPECIFIED   = 0;
  NODE_STATE_BOOTSTRAPPING = 1; // first contact, no valid cert yet
  NODE_STATE_ACTIVE        = 2; // mTLS established, serving traffic
  NODE_STATE_EXPIRING      = 3; // cert within 30-day warning window
  NODE_STATE_RENEWING      = 4; // CSR sent to CP, awaiting new cert
  NODE_STATE_REVOKED       = 5; // revocation event received and verified
  NODE_STATE_RE_ENROLLMENT = 6; // post-revocation, seeking new cert
  NODE_STATE_DRAINING      = 7; // graceful shutdown, no new connections
}

enum BundleType {
  BUNDLE_TYPE_UNSPECIFIED = 0;
  BUNDLE_TYPE_TRUST       = 1; // CA trust bundle
  BUNDLE_TYPE_POLICY      = 2; // access policy bundle
  BUNDLE_TYPE_CRL         = 3; // certificate revocation list
  BUNDLE_TYPE_CONFIG      = 4; // runtime config bundle
}

enum CertReason {
  CERT_REASON_UNSPECIFIED = 0;
  CERT_REASON_INITIAL     = 1; // first-time provisioning at bootstrap
  CERT_REASON_ROTATION    = 2; // scheduled 60-day rotation
  CERT_REASON_RECOVERY    = 3; // expired cert recovery — goes direct to CP
  CERT_REASON_COMPROMISE  = 4; // emergency rekey after suspected compromise
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED     = 0;
  COMMAND_TYPE_ROTATE_CERT     = 1; // CP triggers cert rotation
  COMMAND_TYPE_FORCE_RECONNECT = 2; // drop all client connections, force reauth
  COMMAND_TYPE_DRAIN           = 3; // graceful shutdown — stop accepting new conns
  COMMAND_TYPE_FETCH_CONFIG    = 4; // pull latest config from CP immediately
  COMMAND_TYPE_REVOKE          = 5; // node is revoked — enter REVOKED state now
}

enum AnomalyType {
  ANOMALY_TYPE_UNSPECIFIED          = 0;
  ANOMALY_TYPE_CERT_VALIDATION_FAIL = 1; // repeated cert failures from a peer
  ANOMALY_TYPE_POLICY_DENY_SPIKE    = 2; // sudden spike in access denials
  ANOMALY_TYPE_REPLAY_DETECTED      = 3; // possible replay attack on bundle delivery
  ANOMALY_TYPE_UNKNOWN_PEER         = 4; // peer presenting unrecognized cert
  ANOMALY_TYPE_EXPIRED_CERT_ATTEMPT = 5; // peer attempted connection with expired cert
}

enum RevocationReason {
  REVOCATION_REASON_UNSPECIFIED  = 0;
  REVOCATION_REASON_KEY_COMPROMISE = 1;
  REVOCATION_REASON_DECOMMISSION   = 2; // node decommissioned intentionally
  REVOCATION_REASON_POLICY         = 3; // policy-driven revocation
  REVOCATION_REASON_SUPERSEDED     = 4; // replaced by a new node identity
}

// =============================================================================
// SHARED — used across multiple services
// =============================================================================

// NodeIdentity is sent on every stream open and in every heartbeat.
// CP uses this to track exact state of every node without separate queries.
message NodeIdentity {
  string    node_id           = 1;  // stable ID — never changes (gw-eu-west-001)
  NodeType  node_type         = 2;
  NodeState state             = 3;  // current lifecycle state
  string    binary_version    = 4;  // Ashrix binary version for compatibility checks
  int64     bundle_version    = 5;  // trust bundle version currently applied
  int64     policy_version    = 6;  // policy bundle version currently applied
  int64     crl_version       = 7;  // CRL version currently applied
  int64     config_version    = 8;  // config bundle version currently applied
  string    cert_serial       = 9;  // serial of currently active cert
  google.protobuf.Timestamp cert_expires_at = 10; // when active cert expires
}

// SignedPayload wraps every bundle or command sent CP → node.
// Nodes verify the ECDSA signature using the CP public key embedded in the binary
// before parsing or applying the inner payload. A failed signature = discard entirely.
message SignedPayload {
  int64      version    = 1; // monotonically increasing — reject if <= node's current version
  bytes      payload    = 2; // serialized inner message (TrustBundle, PolicyBundle, etc.)
  bytes      signature  = 3; // ECDSA-P384 over SHA256(version_bytes || payload)
  BundleType type       = 4; // what is inside payload
  google.protobuf.Timestamp issued_at  = 5;
  google.protobuf.Timestamp expires_at = 6; // short TTL — reject if now > expires_at
}

// PossessionProof proves the requester holds the private key for their current cert.
// Required on all cert renewal and recovery requests.
// Prevents cert hijacking: knowing node_id alone is not sufficient.
//
// proof_signature = SIGN(SHA256(csr_pem || node_id || timestamp), current_private_key)
// CP verifies against public key in currently issued cert.
message PossessionProof {
  bytes                     proof_signature = 1;
  google.protobuf.Timestamp timestamp       = 2; // included in signed digest — prevents replay
}

// =============================================================================
// BOOTSTRAP SERVICE
// First contact for both gateways and connectors.
// Uses public-CA-validated HTTPS — the only moment public CAs are relevant.
// After bootstrap, all communication switches to private PKI.
// =============================================================================

service BootstrapService {
  // Called once per node lifetime.
  // Bootstrap token is single-use and expires in minutes.
  // Returns everything the node needs to start operating.
  rpc Bootstrap(BootstrapRequest) returns (BootstrapResponse);
}

message BootstrapRequest {
  string   bootstrap_token = 1; // one-time token, issued out-of-band by CP operator
  string   node_id         = 2; // stable ID the org has assigned this node
  NodeType node_type       = 3;
  bytes    csr_pem         = 4; // node generates keypair locally, sends only CSR
  string   binary_version  = 5;
}

message BootstrapResponse {
  bytes         cert_pem        = 1; // signed node certificate (90-day validity)
  bytes         ca_chain_pem    = 2; // intermediate CA + root CA (PEM) — initial trust bundle
  string        cp_endpoint     = 3; // CP gRPC address — retained permanently as break-glass
  string        gateway_address = 4; // gateway gRPC address (connectors only; empty for gateways)
  SignedPayload policy_bundle   = 5; // initial policy bundle — verify with embedded CP public key
  SignedPayload config_bundle   = 6; // initial config bundle — verify with embedded CP public key
  google.protobuf.Timestamp registered_at = 7;
}

// =============================================================================
// IDENTITY SERVICE
// Cert lifecycle: issuance, rotation, and expired-cert recovery.
// Called directly by both gateways and connectors.
// Connectors call this via the break-glass CP endpoint — not through the gateway.
// =============================================================================

service IdentityService {

  // IssueCert covers: CERT_REASON_ROTATION and CERT_REASON_COMPROMISE.
  // Node must provide a possession proof signed with its current private key.
  // CP verifies possession before issuing new cert — prevents hijacking during renewal.
  rpc IssueCert(CertRequest) returns (CertResponse);

  // RecoverCert covers: CERT_REASON_RECOVERY (expired cert).
  // Node does NOT connect to gateway first. It calls CP directly.
  // Gateway never accepts expired certificates under any circumstances.
  // Node proves it holds the private key via possession proof even though cert is expired.
  // CP validates: node_id is registered + possession proof is valid against known public key.
  rpc RecoverCert(CertRecoveryRequest) returns (CertResponse);
}

message CertRequest {
  NodeIdentity   identity         = 1;
  bytes          csr_pem          = 2; // private key never leaves the node
  CertReason     reason           = 3;
  PossessionProof possession_proof = 4; // required — proves ownership of current private key
}

message CertRecoveryRequest {
  string          node_id          = 1; // identity without a valid cert to embed
  NodeType        node_type        = 2;
  bytes           csr_pem          = 3;
  PossessionProof possession_proof = 4; // signed with existing (still valid) private key
  string          binary_version   = 5;
}

message CertResponse {
  bytes  cert_pem      = 1; // signed node certificate
  bytes  ca_chain_pem  = 2; // intermediate CA + root CA chain (PEM)
  string serial        = 3; // cert serial — stored by node for revocation self-check
  google.protobuf.Timestamp expires_at = 4;
}

// =============================================================================
// CONTROL SERVICE — CP ↔ Gateway
// One persistent bidirectional mTLS gRPC stream per gateway.
// If stream drops, gateway reconnects immediately carrying NodeIdentity
// so CP knows exactly what the gateway has and what it missed.
// =============================================================================

service ControlService {
  rpc ControlStream(stream GatewayEnvelope) returns (stream CPEnvelope);
}

// ── Gateway → CP ─────────────────────────────────────────────────────────────

// GatewayEnvelope: top-level message from gateway to CP.
// Exactly one payload per message.
message GatewayEnvelope {
  string node_id = 1; // always set

  oneof payload {
    Heartbeat      heartbeat   = 2;
    BundleAck      bundle_ack  = 3;
    CommandAck     command_ack = 4;
    AccessLogBatch access_logs = 5;
    MetricsBatch   metrics     = 6;
    AnomalyReport  anomaly     = 7;
  }
}

message Heartbeat {
  NodeIdentity identity            = 1; // full state snapshot — CP needs no separate query
  int32        active_connections  = 2; // live connections (connectors + clients)
  int32        active_sessions     = 3; // authenticated sessions
  int32        connector_count     = 4; // how many connectors currently connected
  repeated ConnectorsStatus connector_status = 5;
}

message ConnectorsStatus {
  string                    connector_id = 1;
  string                    status       = 2; //connected | disconnected
  google.protobuf.Timestamp last_checked = 3;
}


message BundleAck {
  int64      bundle_version = 1; // version being acknowledged
  BundleType bundle_type    = 2;
  bool       applied        = 3; // true = successfully verified and applied
  string     error          = 4; // set if applied=false — reason for failure
}

// CommandAck: gateway confirms it received and acted on a CP command.
// CP uses command_id for idempotency — safe to redeliver on reconnect.
message CommandAck {
  string      command_id = 1;
  CommandType type       = 2;
  bool        accepted   = 3;
  string      error      = 4; // set if accepted=false
}

message AccessLogBatch {
  repeated AccessLogEntry entries = 1;
}

message AccessLogEntry {
  string session_id         = 1;
  string client_cert_serial = 2; // who connected — cert serial as stable identity
  string connector_id       = 3; // which connector (if applicable)
  string target_app_id      = 4; // which internal app was accessed
  string action             = 5; // ALLOW / DENY
  string policy_id          = 6; // which policy rule matched
  string deny_reason        = 7; // set if action=DENY
  int32  status_code        = 8;
  int64  bytes_in           = 9;
  int64  bytes_out          = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp ended_at   = 12;
}

message MetricsBatch {
  google.protobuf.Timestamp collected_at       = 1;
  int64  total_requests                        = 2;
  int64  denied_requests                       = 3;
  int64  tls_handshake_count                   = 4;
  int64  tls_handshake_errors                  = 5;
  int64  cert_validation_failures              = 6;
  int64  revoked_cert_rejections               = 7; // per-call CRL check hits
  double p50_latency_ms                        = 8;
  double p95_latency_ms                        = 9;
  double p99_latency_ms                        = 10;
  int32  active_connections                    = 11;
  int32  active_connectors                     = 12;
  double cpu_usage_percent                     = 13;
  double mem_usage_bytes                       = 14;
}

message AnomalyReport {
  AnomalyType type             = 1;
  string      peer_id          = 2; // node_id or cert serial of the triggering peer
  string      detail           = 3;
  int32       occurrence_count = 4; // within the observation window
  google.protobuf.Timestamp first_seen = 5;
  google.protobuf.Timestamp last_seen  = 6;
}

// ── CP → Gateway ─────────────────────────────────────────────────────────────

// CPEnvelope: top-level message from CP to gateway.
// Also used when gateway relays CP payloads to connectors —
// the SignedPayload inside BundleUpdate and Command is CP-signed,
// so connectors verify it directly using the embedded CP public key.
// The gateway cannot forge or modify these payloads.
message CPEnvelope {
  string node_id = 1;

  oneof payload {
    HeartbeatResponse heartbeat_response = 2;
    BundleUpdate      bundle_update      = 3;
    Command           command            = 4;
  }
}

message HeartbeatResponse {
  google.protobuf.Timestamp server_time = 1; // for clock drift detection
  NodeState expected_state = 2; // CP's view of what state this node should be in
}

message BundleUpdate {
  BundleType    type    = 1;
  SignedPayload payload = 2;
  // payload.signature verified by node using embedded CP public key.
  // Gateway relays this to connectors unchanged — any modification invalidates the signature.
}

message Command {
  string      command_id = 1; // idempotency key — node acks this; safe to redeliver
  CommandType type       = 2;
  string      reason     = 3; // human-readable — why CP issued this
  SignedPayload signed_command = 4;
  // signed_command contains the command params serialized and CP-signed.
  // Connectors verify this before acting — a compromised gateway cannot forge commands.

  oneof params {
    RotateCertParams     rotate_cert     = 5;
    ForceReconnectParams force_reconnect = 6;
    DrainParams          drain           = 7;
    RevokeParams         revoke          = 8;
  }
}

message RotateCertParams {
  google.protobuf.Timestamp rotate_before = 1; // node must complete rotation before this deadline
}

message ForceReconnectParams {
  repeated string session_ids = 1; // empty = all sessions
  string          reason      = 2; // surfaced to clients on disconnect
}

message DrainParams {
  google.protobuf.Timestamp drain_deadline = 1; // hard cutoff — force close after this
}

message RevokeParams {
  string            cert_serial = 1;
  RevocationReason  reason      = 2;
  bool              allow_reenrollment = 3; // if true, node may request new cert after revocation
}

// =============================================================================
// CONNECTOR SERVICE — Gateway ↔ Connector
// One persistent bidirectional mTLS stream per connector.
// Carries both application traffic AND management events (bundle relays, commands).
// All management payloads are CP-signed — gateway cannot forge them.
// Connector verifies using embedded CP public key before applying anything.
// =============================================================================

service ConnectorService {
  rpc ConnectorStream(stream ConnectorEnvelope) returns (stream GatewayToConnectorEnvelope);
}

// ── Connector → Gateway ──────────────────────────────────────────────────────

message ConnectorEnvelope {
  string connector_id = 1; // always set

  oneof payload {
    ConnectorHeartbeat      heartbeat   = 2;
    BundleAck               bundle_ack  = 3;
    CommandAck              command_ack = 4;
    ConnectorAccessLogBatch access_logs = 5;
    ConnectorMetrics        metrics     = 6;
  }
}

message ConnectorHeartbeat {
  NodeIdentity identity           = 1;
  int32        active_app_tunnels = 2; // live tunnels to internal apps
}

message ConnectorAccessLogBatch {
  repeated ConnectorAccessLogEntry entries = 1;
}

message ConnectorAccessLogEntry {
  string session_id    = 1;
  string target_app_id = 2;
  string action        = 3; // ALLOW / DENY
  string policy_id     = 4;
  int64  bytes_in      = 5;
  int64  bytes_out     = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at   = 8;
}

message ConnectorMetrics {
  google.protobuf.Timestamp collected_at  = 1;
  int32  active_app_tunnels               = 2;
  int64  total_requests                   = 3;
  int64  denied_requests                  = 4;
  double p95_latency_ms                   = 5;
  double cpu_usage_percent                = 6;
  double mem_usage_bytes                  = 7;
}

// ── Gateway → Connector ──────────────────────────────────────────────────────

message GatewayToConnectorEnvelope {
  string connector_id = 1;

  oneof payload {
    ConnectorHeartbeatResponse heartbeat_response = 2;
    BundleUpdate               bundle_update      = 3; // relayed from CP — CP-signed
    Command                    command            = 4; // relayed from CP — CP-signed
  }
}

message ConnectorHeartbeatResponse {
  google.protobuf.Timestamp server_time  = 1;
  NodeState                 expected_state = 2;
}

// =============================================================================
// BUNDLE INNER PAYLOADS
// Serialized inside SignedPayload.payload.
// Never parsed until signature verification passes.
// =============================================================================

// TrustBundle — BUNDLE_TYPE_TRUST
// During intermediate CA rotation: [root_ca, inter_v1, inter_v2]
// After rotation confirmed across all nodes: [root_ca, inter_v2]
// v1 removed only after CP version ledger confirms every node has acked v2.
message TrustBundle {
  int64          version   = 1;
  repeated bytes certs_pem = 2; // root CA cert + one or more intermediate CA certs
}

// PolicyBundle — BUNDLE_TYPE_POLICY
message PolicyBundle {
  int64            version  = 1;
  repeated Policy  policies = 2;
}

message Policy {
  string         policy_id = 1;
  string         app_id    = 2; // which internal app this policy governs
  repeated Rule  rules     = 3;
}

message Rule {
  string          rule_id    = 1;
  repeated string identities = 2; // cert serials or identity group references
  string          action     = 3; // ALLOW / DENY
  repeated string resources  = 4; // URL paths, methods, or * for all
  google.protobuf.Timestamp expires_at = 5; // optional per-rule expiry
}

// CRLBundle — BUNDLE_TYPE_CRL
// Gateway checks every cert serial against this on every gRPC call — not just at handshake.
// This ensures emergency revocation takes effect on active long-lived connections.
message CRLBundle {
  int64           version          = 1;
  repeated string revoked_serials  = 2; // cert serial numbers as hex strings
  google.protobuf.Timestamp next_update = 3; // when to expect next CRL push
}

// ConfigBundle — BUNDLE_TYPE_CONFIG
message ConfigBundle {
  int64 version                    = 1;
  int32 max_connection_age_secs    = 2; // force reconnect interval — fresh cert verify on each
  int32 heartbeat_interval_secs    = 3;
  int32 log_flush_interval_secs    = 4;
  int32 metrics_interval_secs      = 5;
  int32 tls_handshake_timeout_ms   = 6;
  int32 max_concurrent_connections = 7;
  bool  ocsp_stapling_enabled      = 8;
  int32 cert_expiry_warn_days      = 9;  // enter EXPIRING state this many days before expiry
  int32 cert_rotation_trigger_days = 10; // trigger rotation this many days before expiry
}
