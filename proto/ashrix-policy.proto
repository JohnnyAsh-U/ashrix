syntax = "proto3";

package proto;

option go_package = "github.com/JohnnyAsh-U/ashrix-api/proto/ashrix-policy.proto;proto";

import "google/protobuf/timestamp.proto";


// =============================================================================
// Policy Messages
// =============================================================================

message ScheduleRule {
  string day = 1;
  string start = 2;
  string end = 3;
}

message Schedule {
    string schedule_id = 1;
    string org_id = 2;
    string name = 3;
    repeated ScheduleRule rules = 4;
}