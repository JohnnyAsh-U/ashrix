syntax = "proto3";

package proto;
import "ashrix-policy.proto";

option go_package = "github.com/JohnnyAsh-U/ashrix-api/proto/gen;proto";
import "google/protobuf/timestamp.proto";

// =============================================================================
// Gateway Bootstrap Proto Types
// =============================================================================

message GatewayEnrollRequest {
  string                    token     = 1;
  string                    csr_pem   = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message GatewayEnrollResponse {
  string                    gateway_id   = 1;
  string                    tenant_id    = 2;
  string                    gateway_name = 3;
  string                    gateway_url  = 4;
  string                    certificate  = 5;
  string                    trust_bundle = 6;
  string                    cp_pub_key   = 7;
  google.protobuf.Timestamp expires_at   = 8;
}

message GatewayRenewCertRequest {
  string                    gateway_id = 1;
  string                    signature  = 2;
  string                    csr_pem    = 3;
  google.protobuf.Timestamp timestamp  = 4;
}

message GatewayRenewCertResponse {
  string                    gateway_id   = 1;
  string                    certificate  = 2;
  string                    trust_bundle = 3;
  google.protobuf.Timestamp expires_at   = 4;
}

// =============================================================================
// Control Plane Service
// =============================================================================
//This Exchange and connect
service ControlPlaneService {
  //Exchange
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);
  //Connect
  rpc Connect(stream GatewayEnvelope) returns (stream CPEnvelope);
}

// =============================================================================
// Gateway Authentication Proto Types
// =============================================================================

//Exchangerequest
message ExchangeTokenRequest {
  string gateway_name = 1;
  string token_hash   = 2;
}

message NormalizedIdentity {
  string                    tenant_id   = 1;
  string                    provider_id = 2;
  string                    user_id     = 3;
  string                    email       = 4;
  string                    name        = 5;
  repeated string           groups      = 6;
  string                    provider    = 7;
  string                    cp_session_id = 8;
  google.protobuf.Timestamp auth_time   = 9;
}

message ExchangeTokenResponse {
  bool               valid         = 1;
  NormalizedIdentity identity      = 2;
  string             error_message = 3;
}

// =============================================================================
// Top Level Envelopes
// =============================================================================

//GatewayEnvelope - Gateway => CP
message GatewayEnvelope {
  string                    gateway_id = 1;
  google.protobuf.Timestamp sent_at    = 2;

  oneof payload {
    HelloMessage     hello     = 10;
    HeartbeatMessage heartbeat = 11;
    CmdAck           cmd_ack   = 12;
  }
}

//CPEnvelope - CP => Gateway
message CPEnvelope {
  google.protobuf.Timestamp sent_at = 1;

  oneof payload {
    HelloAck     hello_ack     = 10;
    PolicyBundle policy_bundle = 11;
    Command      cmd           = 12;
  }
}

message Command {
  oneof payload {
    RotateGatewayCertCmd   rotate_gateway_cert   = 1;
    RevokeGatewayCertCmd   revoke_gateway_cert   = 2;
    RevokeGatewayCmd       revoke_gateway        = 3;
    RevokeSessionCmd       revoke_session        = 4;
    DrainGatewayCmd        drain_gateway         = 5;
    RevokeConnectorCmd     revoke_connector      = 6;
    RotateConnectorCertCmd rotate_connector_cert = 7;
    RevokeConnectorCertCmd revoke_connector_cert = 8;
    CrlSyncCmd             crl_sync              = 9;
    ConnectorSyncCmd       connector_sync        = 10;
  }
}

message RotateGatewayCertCmd {}
message RevokeGatewayCertCmd {}
message RevokeGatewayCmd {}
message RevokeSessionCmd {
  string session_id = 1;
}
message DrainGatewayCmd {}
message RevokeConnectorCmd {
  string connector_id = 1;
}
message RotateConnectorCertCmd {
  string connector_id = 1;
}
message RevokeConnectorCertCmd {
  string connector_id = 1;
}

message CrlSyncCmd {
  repeated string revoked_serial_numbers = 1;
}

message ConnectorSyncCmd {
  repeated ConnectorInfo connectors = 1;
}

message ConnectorInfo {
  string id = 1;
  string status = 2;
}

// =============================================================================
// Gateway to CP Messages
// =============================================================================

message HelloMessage {
  string gateway_id     = 1;  // stable ID — never changes
  string tenant_id = 2;
  string binary_version = 3;  // Ashrix binary version for compatibility checks
  int64  policy_version = 4;  // policy bundle version currently applied
}

//Ack for Cmds
message CmdAck {
  string cmd_id = 1;
  string gateway_id = 2;
  google.protobuf.Timestamp time_stamp = 3;
}

message HeartbeatMessage {
  int64                     seq                = 1; // full state snapshot — CP needs no separate query
  int32                     active_connections = 2; // live connections (connectors + clients)
  int32                     active_sessions    = 3; // authenticated sessions
  int32                     connector_count    = 4; // how many connectors currently connected
  repeated ConnectorsStatus connector_status   = 5;
}

message ConnectorsStatus {
  string                    connector_id = 1;
  string                    status       = 2; //connected | disconnected
  google.protobuf.Timestamp last_checked = 3;
}

// =============================================================================
// CP to Gateway Messages
// =============================================================================

message HelloAck {
  string                    server_version = 1;
  bool                      needs_policy   = 2;
  bool                      needs_trust    = 3;
  bool                      needs_crl      = 4;
  google.protobuf.Timestamp server_time    = 5;
}

message PolicyBundle {
  int64 version   = 1;  // bundle protocol version
  int64 issued_at = 2;  // epoch ms
  // Delta or full snapshot — gateway unpacks these one by one
  repeated PolicyRecord records = 3;

  // Signs: H(version || issued_at || H(record[0]) || H(record[1]) || ...)
  // where H(record[i]) is the hash of the *serialized* PolicyRecord bytes
  bytes signature = 4;
}



