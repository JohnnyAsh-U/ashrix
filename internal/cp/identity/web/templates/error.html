<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="referrer"
        content="no-referrer"
    >

    <title>Sign in — Ashrix</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f6f8fc;

            color: #111827;
        }

        .container {

            width: 100%;

            max-width: 420px;
        }

        .card {

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            padding: 36px;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.06);
        }


        /* -------------------------------
           BRAND
        -------------------------------- */

        .brand {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-bottom: 30px;
        }

        .brand-logo {

            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #2563eb;

            color: #ffffff;

            font-size: 21px;

            font-weight: 800;

            box-shadow:
                0 5px 12px rgba(37, 99, 235, 0.2);
        }

        .brand-name {

            font-size: 22px;

            font-weight: 700;

            letter-spacing: -0.4px;
        }


        /* -------------------------------
           HEADER
        -------------------------------- */

        h1 {

            margin: 0;

            text-align: center;

            font-size: 24px;

            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .subtitle {

            margin: 10px 0 28px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            line-height: 1.5;
        }


        /* -------------------------------
           PROVIDERS
        -------------------------------- */

        .providers {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .provider {

            width: 100%;

            min-height: 54px;

            display: flex;

            align-items: center;

            padding: 0 16px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background: #ffffff;

            color: #111827;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease,
                transform 0.1s ease;
        }

        .provider:hover {

            background: #f9fafb;

            border-color: #2563eb;

            box-shadow:
                0 3px 10px rgba(37, 99, 235, 0.08);

            transform: translateY(-1px);
        }

        .provider:active {

            transform: translateY(0);
        }

        .provider-icon {

            width: 28px;

            height: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 12px;

            flex-shrink: 0;
        }

        .provider-name {

            flex: 1;

            text-align: left;
        }

        .arrow {

            color: #9ca3af;

            font-size: 18px;

            transition:
                color 0.15s ease,
                transform 0.15s ease;
        }

        .provider:hover .arrow {

            color: #2563eb;

            transform: translateX(3px);
        }


        /* -------------------------------
           FOOTER
        -------------------------------- */

        .footer {

            margin-top: 28px;

            text-align: center;

            color: #9ca3af;

            font-size: 12px;
        }


        /* -------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .card {
                padding: 28px 22px;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">


        <!-- Ashrix brand -->

        <div class="brand">

            <div class="brand-logo">
                A
            </div>

            <div class="brand-name">
                Ashrix
            </div>

        </div>


        <!-- Heading -->

        <h1>
            Error
        </h1>

        <p class="subtitle">
            Choose your identity provider to continue.
        </p>


        <!-- Providers -->

        <div class="providers">

            {{ range .Providers }}

            <a
                class="provider"
                href="{{ .URL }}"
                aria-label="Continue with {{ providerDisplayName .Name }}"
            >

                <span class="provider-icon">

                    {{ providerIcon .Name }}

                </span>

                <span class="provider-name">

                    Continue with
                    {{ providerDisplayName .Name }}

                </span>

                <span class="arrow">
                    →
                </span>

            </a>

            {{ end }}

        </div>


        <div class="footer">
            Secured by Ashrix
        </div>


    </div>

</div>

</body>

</html>
