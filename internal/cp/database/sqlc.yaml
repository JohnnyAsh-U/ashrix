version: "2"
sql:
   - engine: "postgresql"
     queries: "queries"
     schema: "migrations"
     gen: 
        go:
           package: "store"
           out: "./store"
           emit_json_tags: true
           emit_interface: true
           emit_prepared_queries: false
           emit_exact_table_names: false
           emit_empty_slices: true
           sql_package: "pgx/v5"
           overrides:
              - db_type: "uuid"
                go_type: "github.com/google/uuid.UUID"
              - db_type: "timestamptz"
                go_type: "time.Time"
              - db_type: "jsonb"
                go_type: "encoding/json.RawMessage"